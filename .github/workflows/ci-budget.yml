name: ci-budget (≤ 5 min)

# Règle user 2026-10-24 : toute CI rend son verdict en 5 min au plus.
# Ce workflow est un garde-fou de configuration, pas un test applicatif :
# il échoue si un job déclare plus de 5 minutes (ou aucun timeout).
# Il tourne sur chaque PR pour que le check `ci-budget` existe toujours
# (condition de file Mergify) — coût : quelques secondes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Groupe déjà par PR ; on n'annule plus un run en cours : un check annulé
  # compte rouge pour Mergify (piège de concurrency n°1).
  group: ci-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-budget:
    name: ci-budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (actions/checkout@v4, épinglé par SHA — item F84)
        with:
          fetch-depth: 1
          persist-credentials: false
          # Le workspace d'un runner self-hosted est partagé entre les jobs du
          # même dépôt : `clean: true` (le défaut) lance `git clean -ffdx`, qui
          # supprime les ~150 000 fichiers de node_modules. Deux effets mesurés
          # le 12/11 : ce job dépasse seul le budget de 5 min quand le worker est
          # chargé, et le job suivant doit tout recopier (cp -al) ou réinstaller
          # (npm ci) — d'où les annulations en cascade sur ci et couche0.
          clean: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Vérifier le budget de 5 min par job
        run: python3 .github/ci-budget/check_timeouts.py