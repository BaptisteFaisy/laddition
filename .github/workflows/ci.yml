name: ci

# Budget CI 5 min (règle user 2026-10-24) : typage, tests, garde de taille.
# Le build Forge (`forge build`) et le déploiement restent hors PR.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'manifest.yml'

concurrency:
  # Un groupe PAR PR (par ref pour push/main), jamais par dépôt : avec
  # `cancel-in-progress: true`, deux runs concurrents s'annulaient et un check
  # annulé compte rouge pour Mergify (piège de concurrency n°1).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, laddition-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (actions/checkout@v4, épinglé par SHA — item F84)
        with:
          fetch-depth: 1
          persist-credentials: false
          # Le workspace d'un runner self-hosted est persistant : garder
          # node_modules d'un run à l'autre évite 1,6 Go de réinstallation à
          # chaque PR (mesuré le 11/11 : npm ci seul dépassait le budget de
          # 5 min quand la machine est chargée).
          clean: false
      - name: Node 22 (déjà installé sur le worker)
        id: localnode
        run: |
          if [ -x "$HOME/node-current/bin/node" ]; then
            echo "$HOME/node-current/bin" >> "$GITHUB_PATH"
            echo "found=1" >> "$GITHUB_OUTPUT"
            "$HOME/node-current/bin/node" -v
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (actions/setup-node@v4, épinglé par SHA — item F84)
        if: steps.localnode.outputs.found != '1'
        with:
          node-version: 22
      - name: Dépendances (arbre partagé sur le worker, clé = empreinte du lockfile)
        run: |
          HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          SHARED="$HOME/.cache/laddition-nm/$HASH"
          STAMP="node_modules/.laddition-nm-hash"
          # Copie à liens durs, PAS un lien symbolique : avec node_modules en
          # symlink, Node résout les dépendances transitives depuis le chemin
          # réel et ne remonte jamais jusqu'au vrai node_modules
          # (constat du 11/11 : « Cannot find module 'fast-deep-equal' »).
          # cp -al ne copie aucun octet, seulement des inœuds.
          # L'empreinte évite de recopier un arbre déjà en place : cp -al crée
          # ~150 000 entrées et, worker chargé (charge 47 mesurée le 12/11),
          # la recopie seule dépasse le budget de 5 min — sans jamais allonger
          # ce budget (règle user 2026-10-24), on ne recopie que si nécessaire.
          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$HASH" ] && [ -d node_modules/typescript ]; then
            echo "arbre déjà en place ($HASH) : aucune recopie"
            exit 0
          fi
          rm -rf node_modules
          if [ -d "$SHARED" ]; then
            cp -al "$SHARED" node_modules
            echo "arbre partagé relié par liens durs ($HASH)"
          else
            npm ci --no-audit --no-fund --prefer-offline
            mkdir -p "$HOME/.cache/laddition-nm"
            rm -rf "$SHARED"
            cp -al node_modules "$SHARED"
            echo "arbre installé puis mis en cache ($HASH)"
          fi
          echo "$HASH" > "$STAMP"
      - name: Typage strict
        run: npm run typecheck
      - name: Tests du domaine
        run: npm test
