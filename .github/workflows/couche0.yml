name: couche0

# Couche 0 : les règles dures du dépôt, vérifiées avant toute revue.
#   - moins de 500 lignes par fichier de code, moins de 50 lignes par fonction
#   - manifest.yml valide contre le schéma Forge officiel
#   - manifest ↔ code cohérent : handlers exportés, ressources présentes,
#     écrans UI Kit 2 en render: native, actions exposées dans rovo:mcp (F81/F82)
#   - chaque dossier de src/ porte des tests (exceptions motivées) et src/core
#     n'importe aucun @forge/* (F83)
#   - aucune duplication de fichier de test (deux fois le même contenu)
# Budget CI 5 min (règle user 2026-10-24).

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'manifest.yml'

concurrency:
  # Un groupe PAR PR (par ref pour push/main) et aucune annulation : un check
  # annulé compte rouge pour Mergify (piège de concurrency n°1).
  group: couche0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  couche0:
    name: couche0
    runs-on: [self-hosted, laddition-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (actions/checkout@v4, épinglé par SHA — item F84)
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false          # node_modules persiste d'un run à l'autre (1,6 Go)
      - name: Node 22 (déjà installé sur le worker)
        id: localnode
        run: |
          if [ -x "$HOME/node-current/bin/node" ]; then
            echo "$HOME/node-current/bin" >> "$GITHUB_PATH"
            echo "found=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (actions/setup-node@v4, épinglé par SHA — item F84)
        if: steps.localnode.outputs.found != '1'
        with:
          node-version: 22
      - name: Tailles (fichiers < 500, fonctions < 50)
        run: python3 tools/check_limits.py
      - name: Tests du gate hermes (conflits)
        run: python3 .github/hermes/test_gate.py
      - name: Dépendances (arbre partagé sur le worker, clé = empreinte du lockfile)
        run: |
          HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          SHARED="$HOME/.cache/laddition-nm/$HASH"
          STAMP="node_modules/.laddition-nm-hash"
          # Copie à liens durs, PAS un lien symbolique : avec node_modules en
          # symlink, Node résout les dépendances transitives depuis le chemin
          # réel et ne remonte jamais jusqu'au vrai node_modules
          # (constat du 11/11 : « Cannot find module 'fast-deep-equal' »).
          # cp -al ne copie aucun octet, seulement des inœuds.
          # L'empreinte évite de recopier un arbre déjà en place : cp -al crée
          # ~150 000 entrées et, worker chargé (charge 47 mesurée le 12/11),
          # la recopie seule dépasse le budget de 5 min — sans jamais allonger
          # ce budget (règle user 2026-10-24), on ne recopie que si nécessaire.
          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$HASH" ] && [ -d node_modules/typescript ]; then
            echo "arbre déjà en place ($HASH) : aucune recopie"
            exit 0
          fi
          rm -rf node_modules
          if [ -d "$SHARED" ]; then
            cp -al "$SHARED" node_modules
            echo "arbre partagé relié par liens durs ($HASH)"
          else
            npm ci --no-audit --no-fund --prefer-offline
            mkdir -p "$HOME/.cache/laddition-nm"
            rm -rf "$SHARED"
            cp -al node_modules "$SHARED"
            echo "arbre installé puis mis en cache ($HASH)"
          fi
          echo "$HASH" > "$STAMP"
      - name: manifest.yml contre le schéma Forge
        run: node tools/validate_manifest.mjs manifest.yml
      # Items F81/F82 : forge lint/build exigent un login Atlassian ; ces deux
      # gardes tournent hors ligne et font rougir la CI dès qu'une régression
      # casse le déploiement (handler sans export, ressource absente, écran
      # sans render: native, action hors rovo:mcp, dossier de src/ sans test,
      # import @forge/* dans le domaine pur).
      - name: "Cohérence manifest ↔ exports/ressources/render native/MCP (F81, F82)"
        run: node tools/check_manifest_exports.mjs manifest.yml src/index.tsx
      - name: Structure — tests par dossier et pureté de src/core (F83)
        run: python3 tools/check_structure.py
