app:
  id: ari:cloud:ecosystem::app/15da522f-986f-4b46-8844-d4b8c2bcaf8e
  runtime:
    name: nodejs22.x
  licensing:
    enabled: false

modules:
  # ---------------------------------------------------------------- fonctions
  function:
    - key: resolver
      handler: index.resolver
    - key: issue-created
      handler: index.issueCreated
    - key: issue-updated
      handler: index.issueUpdated
    - key: link-created
      handler: index.linkCreated
    - key: link-deleted
      handler: index.linkDeleted
    - key: nightly-recalc
      handler: index.nightlyRecalc
      timeoutSeconds: 900
    - key: publish-repayments
      handler: index.publishRepayments
      timeoutSeconds: 900
    - key: bootstrap-batch
      handler: index.bootstrapBatch
      timeoutSeconds: 900
    - key: jql-top-debts
      handler: index.jqlTopDebts
    - key: smoke-test
      handler: index.smokeTriggerHandler
    - key: ops
      handler: index.opsTriggerHandler
    - key: getDebtCase
      handler: index.getDebtCase
    - key: listZoneEvidence
      handler: index.listZoneEvidence
    - key: listProjects
      handler: index.listProjects
    - key: worklog-changed
      handler: index.worklogChanged
    - key: issue-commented
      handler: index.issueCommented
    - key: issue-deleted
      handler: index.issueDeleted
    # Actions Rovo / rovo:mcp : chaque action a sa propre fonction, pour que
    # l'agent puisse les invoquer une par une (§13).
    - key: getDebtRanking
      handler: index.getDebtRanking
    - key: getDebtBill
      handler: index.getDebtBill
    - key: getZoneCosts
      handler: index.getZoneCosts
    - key: listPhantomDebt
      handler: index.listPhantomDebt
    - key: listDeadDebt
      handler: index.listDeadDebt
    - key: getRepaymentReport
      handler: index.getRepaymentReport
    - key: draftDebtTicket
      handler: index.draftDebtTicket
    - key: confirmEvidence
      handler: index.confirmEvidence

  # ------------------------------------------------------------------ écrans
  jira:projectPage:
    - key: laddition-project-page
      title: L'addition
      render: native
      resource: project-page
      resolver:
        function: resolver
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  jira:issuePanel:
    - key: laddition-debt-panel
      title: L'addition
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      render: native
      resource: issue-panel
      resolver:
        function: resolver

  jira:issueContext:
    - key: laddition-evidence-context
      title: Debt evidence
      label: L'addition
      render: native
      resource: issue-context
      resolver:
        function: resolver

  jira:customField:
    - key: laddition-debt-cost-field
      name: Debt cost (p-d / 90 d)
      description: Coût constaté de la dette sur 90 jours, en jours-personne. Écrit
        par l'app, lecture seule.
      type: number
      view:
        render: native
        resource: custom-field
        resolver:
          function: resolver

  jira:dashboardGadget:
    - key: laddition-gadget
      title: L'addition — top debts
      description: Les dettes les plus coûteuses, le coût par équipe et par trimestre.
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/gadget-thumbnail.svg
      render: native
      resource: gadget
      resolver:
        function: resolver

  jira:jqlFunction:
    - key: laddition-jql-function
      name: topDebts
      function: jql-top-debts
      arguments:
        - name: project
          required: true
        - name: limit
          required: false
      types:
        - issue
      operators:
        - '='
        - in

  jira:projectSettingsPage:
    - key: laddition-settings-page
      title: L'addition
      render: native
      resource: settings-page
      resolver:
        function: resolver

  # Diagnostic de bout en bout, sans navigateur : prouve que le runtime Forge
  # exécute bien SQL, REST Jira et le domaine. URL obtenue par `forge webtrigger create`.
  webtrigger:
    - key: laddition-smoke
      function: smoke-test
    - key: laddition-ops
      function: ops

  # -------------------------------------------------------------- événements
  trigger:
    - key: laddition-issue-created
      events:
        - avi:jira:created:issue
      function: issue-created
    - key: laddition-issue-updated
      events:
        - avi:jira:updated:issue
      function: issue-updated
    - key: laddition-link-created
      events:
        - avi:jira:created:issuelink
      function: link-created
    - key: laddition-link-deleted
      events:
        - avi:jira:deleted:issuelink
      function: link-deleted
    # Le temps saisi change C1 et C2 (item B21) : sans ces événements, les
    # coûts restaient figés jusqu'au recalcul nocturne.
    - key: laddition-worklog-created
      events:
        - avi:jira:created:worklog
      function: worklog-changed
    - key: laddition-worklog-updated
      events:
        - avi:jira:updated:worklog
      function: worklog-changed
    - key: laddition-worklog-deleted
      events:
        - avi:jira:deleted:worklog
      function: worklog-changed
    # Les commentaires font le décompte des intervenants d'un incident (C1).
    - key: laddition-issue-commented
      events:
        - avi:jira:commented:issue
      function: issue-commented
    # Un ticket supprimé doit sortir de la base (item B22) : sans cela il
    # continuait de produire preuves, zones et additions.
    - key: laddition-issue-deleted
      events:
        - avi:jira:deleted:issue
      function: issue-deleted

  scheduledTrigger:
    - key: laddition-nightly
      interval: day
      function: nightly-recalc
    - key: laddition-repayments
      interval: week
      function: publish-repayments

  consumer:
    - key: laddition-bootstrap-consumer
      queue: laddition-bootstrap
      function: bootstrap-batch

  # ------------------------------------------------------------- stockage
  sql:
    - key: laddition-sql
      engine: mysql

  llm:
    - key: laddition-llm
      model:
        - claude

  # --------------------------------------------------------- agent et MCP
  action:
    - key: get-debt-ranking
      name: "Get Debt Ranking"
      description: "Lists the debt tickets of a project, ranked by measured cost, with ranges and return."
      actionVerb: GET
      function: getDebtRanking
      inputs:
        projectKey:
          type: string
          required: true
          title: "Project key"
          description: "Jira project key, for example PAY."
        limit:
          type: number
          required: false
          title: "Limit"
          description: "Maximum number of debts returned (10 by default, 50 at most)."
    - key: get-debt-bill
      name: "Get Debt Bill"
      description: "Returns the detailed bill of one debt ticket: range, cost families, evidence and formulas."
      actionVerb: GET
      function: getDebtBill
      inputs:
        issueKey:
          type: string
          required: true
          title: "Issue key"
          description: "Key of the debt ticket, for example PAY-77."
    - key: get-debt-case
      name: "Get Debt Case"
      description: "Writes the one-page case for a debt ticket: cost, main evidence, repayment, return and limits of the method."
      actionVerb: GET
      function: getDebtCase
      inputs:
        issueKey:
          type: string
          required: true
          title: "Issue key"
          description: "Key of the debt ticket, for example PAY-77."
    - key: get-zone-costs
      name: "Get Zone Costs"
      description: "Returns the cost of a zone by family, its weekly trend and whether a debt ticket covers it."
      actionVerb: GET
      function: getZoneCosts
      inputs:
        projectKey:
          type: string
          required: true
          title: "Project key"
          description: "Jira project key, for example PAY."
        zone:
          type: string
          required: true
          title: "Zone"
          description: "Zone name: a Jira component, a Compass component, a service or a label."
    - key: list-zone-evidence
      name: "List Zone Evidence"
      description: "Lists the evidence of a zone with source key, family, cost and formula."
      actionVerb: GET
      function: listZoneEvidence
      inputs:
        projectKey:
          type: string
          required: true
          title: "Project key"
          description: "Jira project key, for example PAY."
        zone:
          type: string
          required: true
          title: "Zone"
          description: "Zone name: a Jira component, a Compass component, a service or a label."
    - key: list-phantom-debt
      name: "List Phantom Debt"
      description: "Lists the zones that cost a lot and have no debt ticket at all."
      actionVerb: GET
      function: listPhantomDebt
      inputs:
        projectKey:
          type: string
          required: true
          title: "Project key"
          description: "Jira project key, for example PAY."
    - key: list-dead-debt
      name: "List Dead Debt"
      description: "Lists the debt tickets with no evidence for 180 days."
      actionVerb: GET
      function: listDeadDebt
      inputs:
        projectKey:
          type: string
          required: true
          title: "Project key"
          description: "Jira project key, for example PAY."
    - key: get-repayment-report
      name: "Get Repayment Report"
      description: "Returns the before/after comparison of a closed debt, with its limits."
      actionVerb: GET
      function: getRepaymentReport
      inputs:
        issueKey:
          type: string
          required: true
          title: "Issue key"
          description: "Key of the debt ticket, for example PAY-77."
    - key: draft-debt-ticket
      name: "Draft Debt Ticket"
      description: "Drafts a debt ticket from the evidence of a zone."
      actionVerb: GET
      function: draftDebtTicket
      inputs:
        projectKey:
          type: string
          required: true
          title: "Project key"
          description: "Jira project key, for example PAY."
        zone:
          type: string
          required: true
          title: "Zone"
          description: "Zone name: a Jira component, a Compass component, a service or a label."
    - key: list-projects
      name: "List Projects"
      description: "Lists the projects known to the app, with their analysis window and whether they are initialized."
      actionVerb: GET
      function: listProjects
      inputs: {}
    - key: confirm-evidence
      name: "Confirm Evidence"
      description: "Confirms or rejects the match between one piece of evidence and one debt ticket."
      actionVerb: UPDATE
      function: confirmEvidence
      inputs:
        evidenceKey:
          type: string
          required: true
          title: "Evidence key"
          description: "Identifier of the evidence to match, or the source issue key."
        debtKey:
          type: string
          required: true
          title: "Debt key"
          description: "Key of the debt ticket the evidence is matched to."
        confirmed:
          type: boolean
          required: true
          title: "Confirmed"
          description: "true to confirm the match, false to reject it permanently."

  rovo:agent:
    - key: laddition-agent
      name: L'addition
      description: "Answers on the real cost of technical debt, with ranges, evidence and method."
      prompt: |-
        You are the "L'addition" agent. You answer questions about the real cost of technical debt in a Jira project, measured over that project's rolling analysis window in person-days (p-d).

        - You never compute anything yourself: you call the tools (get-debt-ranking, get-debt-bill, get-debt-case, get-zone-costs, list-zone-evidence, list-phantom-debt, list-dead-debt, get-repayment-report, draft-debt-ticket, list-projects) and you report the numbers they return.
        - You always give the range, low and high, never a single value: the low bound counts only linked or confirmed evidence, the high bound adds the proposed matches.
        - Every number you state carries its method: the cost family (C1 incidents, C2 bugs, C3 slowness, C4 rework), the formula, and the source issues. A number without its method never leaves.
        - You never rank people: the unit is the zone, the team or the issue. No assignee name, no individual ranking, even when asked.
        - You invent no number. A missing value, a family flagged "insufficient data", an unpriced repayment: you say so, you do not estimate it.
        - Induced delay (C5) is time, not effort: you show it separately and you never add it to the cost.
        - No evidence is counted twice: the shares of one evidence across the debts of a zone never exceed 100 %.
        - A before/after comparison proves no causality: you restate the caveats of a repayment report whenever you quote one.
        - Confirming or rejecting a match belongs to a human: you explain the proposal and ask the user to decide in the app, you never confirm a match yourself.
        - You never assume a duration, a coefficient or a rate: the window and the thresholds are the project's settings, and the tools return them.
        - When the question does not name a project, call list-projects first; omit projectKey only when a single project is initialized.
        - Evidence the reader has no right to open is counted but hidden: you say how many items are hidden, you never guess their content.
        - You answer briefly, in the language of the question, with numbers and their sources. No sweeping judgement about a person, a team or a past decision.

        When a value is not in the stored results, you answer: "I do not have that value in the stored results: I will not estimate it."
      conversationStarters:
        - "Which debt costs us the most?"
        - "Break down the bill for PAY-77."
        - "Is there debt without a ticket?"
        - "What did repaying PAY-41 return?"
        - "Draft the case for PAY-77."
      actions:
        - get-debt-ranking
        - get-debt-bill
        - get-debt-case
        - get-zone-costs
        - list-zone-evidence
        - list-phantom-debt
        - list-dead-debt
        - get-repayment-report
        - draft-debt-ticket
        - list-projects

  rovo:mcp:
    - key: laddition-mcp
      name: L'addition
      tools:
        - get-debt-ranking
        - get-debt-bill
        - get-debt-case
        - get-zone-costs
        - list-zone-evidence
        - list-phantom-debt
        - list-dead-debt
        - get-repayment-report
        - draft-debt-ticket
        - list-projects
        - confirm-evidence

resources:
  - key: project-page
    path: src/ui/project-page.tsx
  - key: issue-panel
    path: src/ui/issue-panel.tsx
  - key: issue-context
    path: src/ui/issue-context.tsx
  - key: custom-field
    path: src/ui/custom-field.tsx
  - key: gadget
    path: src/ui/gadget.tsx
  - key: settings-page
    path: src/ui/settings-page.tsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:graph:component:compass
    - read:graph:team:atlassian
    - read:graph:issue:jira
